name: Update GitHub Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh contribution data
        run: npm run update:github-contributions

      - name: Commit updated contribution data
        run: |
          if git diff --quiet -- public/github-contributions.json; then
            echo "Contribution data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/github-contributions.json
          git commit -m "Update GitHub contribution data"
          git push
